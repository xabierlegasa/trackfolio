services:
  app:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
    image: trackfolio-api:prod
    container_name: trackfolio-prod-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ../../trackfolio-api/.env
    volumes:
      # Ansistrano shared storage (persists across releases)
      - ../../trackfolio-api/storage:/var/www/storage
    networks:
      - trackfolio-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue_worker:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
    image: trackfolio-api:prod
    container_name: trackfolio-prod-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ../../trackfolio-api/.env
    volumes:
      - ../../trackfolio-api/storage:/var/www/storage
    networks:
      - trackfolio-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]

  api:
    image: nginx:alpine
    container_name: trackfolio-prod-api
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Release public/ for try_files; PHP runs inside app via FastCGI
      - ../../trackfolio-api/public:/var/www/public:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - trackfolio-prod
    depends_on:
      - app

  front:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.1.136:8080}
    image: trackfolio-front:prod
    container_name: trackfolio-prod-front
    restart: unless-stopped
    ports:
      - "3080:80"
    networks:
      - trackfolio-prod

  db:
    image: mysql:8.0
    container_name: trackfolio-prod-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-trackfolio}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_USER: ${DB_USERNAME:-trackfolio}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - trackfolio-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trackfolio-prod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - trackfolio-prod
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: trackfolio-prod-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trackfolio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - trackfolio-prod
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  trackfolio-prod:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
